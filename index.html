<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>
</head>

<body>

    <h2>Customer Management System</h2>

    <table id="tblindex">
        <tr>
            <td>Name</td>
            <td><input type="text" id="txtName" placeholder="Name"></td>
        </tr>

        <tr>
            <td>Age</td>
            <td><input type="text" id="txtAge" placeholder="Age"></td>
        </tr>

        <tr>
            <td>Address</td>
            <td><input type="text" id="txtAddress" placeholder="Address"></td>
        </tr>

        <tr>
            <td>Salary</td>
            <td><input type="text" id="txtSalary" placeholder="Salary"></td>
        </tr>

        <tr>
            <td>Contact</td>
            <td><input type="text" id="txtContact" placeholder="Contact"></td>
        </tr>

        <tr>
            <td><input type="button" value="Add" onclick="addCustomerOnAction()"></td>
            <td><input type="button" value="Update"></td>
            <td><input type="button" value="Delete"></td>
            <td><input type="button" value="Search"></td>
        </tr>

    </table>
    <h1>Customer Details</h1>
    <table id="tbl">

    </table>
    <script src="app.js"></script>


</body>

</html>
