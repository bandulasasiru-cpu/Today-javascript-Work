<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
</head>

<body>

    <h2>Add Item</h2>

    <table>
        <tr>
            <td>Item</td>
            <td><input type="text" id="txtName" placeholder="Item"></td>
        </tr>

        <tr>
            <td>Item Code</td>
            <td><input type="text" id="txtAge" placeholder="Item Code"></td>
        </tr>

        <tr>
            <td>Price</td>
            <td><input type="text" id="txtAddress" placeholder="Price"></td>
        </tr>

        <tr>
            <td>Quantity</td>
            <td><input type="text" id="txtSalary" placeholder="Quantity"></td>
        </tr>

        <tr>
            <td>Weight</td>
            <td><input type="text" id="txtContact" placeholder="Weight"></td>
        </tr>

        <tr>
            <td><input type="button" value="Add" onclick="addCustomerOnAction()"></td>
            <td><input type="button" value="Update"></td>
            <td><input type="button" value="Delete"></td>
            <td><input type="button" value="Search"></td>
        </tr>

    </table>

    <script src="app.js"></script>


</body>

</html>
